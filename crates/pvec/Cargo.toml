[package]
name = "pvec"
version = "0.0.0"
description = "The PVec facade: the semantic reader and writer surface, with the container encoding kept out of sight"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The features are the matrix of docs/API.md. None of them changes the exported type list, which the
# feature_matrix test asserts under each combination. `unstable-stream` is the only unstable export.
[features]
default = ["std"]
std = []
alloc = []
mmap = []
http = []
wasm = []
unstable-stream = ["dep:pvec-stream"]

[dependencies]
pvec-capabilities = { path = "../pvec-capabilities" }
pvec-components = { path = "../pvec-components" }
pvec-container = { path = "../pvec-container" }
pvec-entity = { path = "../pvec-entity" }
pvec-geometry = { path = "../pvec-geometry" }
pvec-stream = { path = "../pvec-stream", optional = true }

[dev-dependencies]
pvec-checks = { path = "../pvec-checks" }
pvec-corpus = { path = "../pvec-corpus" }
pvec-testkit = { path = "../pvec-testkit" }

[lints]
workspace = true
