[package]
name = "pvec-testkit"
version = "0.0.0"
description = "Test support: the canonical artifact generator over the known-truth corpus (P2.4) and the reference reader the hostile-container tests hold a reader to"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Test support, like pvec-corpus. Only crates of this workspace: no libviprs crate, no CAD or PDF
# reader, nothing that opens a socket or starts a process.
[dependencies]
pvec-capabilities = { path = "../pvec-capabilities" }
pvec-components = { path = "../pvec-components" }
pvec-container = { path = "../pvec-container" }
pvec-corpus = { path = "../pvec-corpus" }
pvec-entity = { path = "../pvec-entity" }
pvec-geometry = { path = "../pvec-geometry" }

[lints]
workspace = true
