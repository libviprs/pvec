[package]
name = "pvec-container"
version = "0.0.0"
description = "The PVec container: header, manifest, blocks, block directory and the deterministic writer"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pvec-capabilities = { path = "../pvec-capabilities" }
pvec-components = { path = "../pvec-components" }
pvec-entity = { path = "../pvec-entity" }
pvec-geometry = { path = "../pvec-geometry" }
pvec-numeric = { path = "../pvec-numeric" }
# Pure Rust, no build script and no native source (a test reads Cargo.lock to keep it so). The codecs
# are ADR 0006's candidates, LZ4 and deflate; XXH3 is its block checksum.
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
miniz_oxide = "0.9"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[lints]
workspace = true
