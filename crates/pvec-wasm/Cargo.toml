[package]
name = "pvec-wasm"
version = "0.0.0"
description = "The WASM-safe packed output interfaces over the pvec facade: typed-array batches, explicit handles, a versioned ABI"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pvec = { path = "../pvec", features = ["unstable-stream", "http"] }
pvec-geometry = { path = "../pvec-geometry" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
pvec-checks = { path = "../pvec-checks" }
pvec-components = { path = "../pvec-components" }
pvec-container = { path = "../pvec-container" }
pvec-entity = { path = "../pvec-entity" }
pvec-stream = { path = "../pvec-stream" }
pvec-testkit = { path = "../pvec-testkit" }

[lints]
workspace = true
