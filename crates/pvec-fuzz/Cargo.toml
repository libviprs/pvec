[package]
name = "pvec-fuzz"
version = "0.0.0"
description = "The fuzz targets of the PVec reader as plain functions, the seed corpus, a structure-aware mutator and a deterministic smoke driver; the libFuzzer glue is in fuzz/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fuzz-only. With it every target first re-seals its input (new block checksums, new artifact digest) when the
# input still lays out as a container, so executions are spent past the checksum gate and not on it. The reader
# is never changed: the input is.
no-checksum-gate = []

# Test support, like pvec-testkit: only crates of this workspace. libFuzzer itself is in `fuzz/`, which is a
# separate workspace because libfuzzer-sys builds C++ and the root lock is kept free of native source.
[dependencies]
pvec-capabilities = { path = "../pvec-capabilities" }
pvec-components = { path = "../pvec-components" }
pvec-container = { path = "../pvec-container" }
pvec-corpus = { path = "../pvec-corpus" }
pvec-entity = { path = "../pvec-entity" }
pvec-stream = { path = "../pvec-stream" }
pvec-testkit = { path = "../pvec-testkit" }

[dev-dependencies]
pvec-geometry = { path = "../pvec-geometry" }

[lints]
workspace = true
