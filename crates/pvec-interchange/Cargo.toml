[package]
name = "pvec-interchange"
version = "0.0.0"
description = "Translation fidelity vocabulary for PVec exports (taxonomy, record, ledger) and the GML, GeoPackage and tile exports"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pvec-capabilities = { path = "../pvec-capabilities" }
pvec-entity = { path = "../pvec-entity" }
pvec-geometry = { path = "../pvec-geometry" }
pvec-numeric = { path = "../pvec-numeric" }

# The schema validation test runs a pinned validator in a hermetic container (pvec-hermetic); the STEP
# digest test hashes the export with the corpus crate's SHA-256.
[dev-dependencies]
pvec-container = { path = "../pvec-container" }
pvec-corpus = { path = "../pvec-corpus" }
pvec-hermetic = { path = "../pvec-hermetic" }
pvec-testkit = { path = "../pvec-testkit" }
# A third-party vector tile decoder, a second opinion on the tiles (issue #133). Dev-only.
mvt-reader = { version = "=2.5.0", default-features = false }
geo-types = "0.7"

[lints]
workspace = true
