[package]
name = "pvec-components"
version = "0.0.0"
description = "Independent component streams: layer, line style, text, hatch, provenance, each skippable and each referring to entities by EntityId"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately no dependency on pvec-geometry or pvec-codec: a component stream has no way to reach a
# curve, which is what keeps it from moving a geometry verdict. The dev-dependencies are only for the
# independence tests.
[dependencies]
pvec-capabilities = { path = "../pvec-capabilities" }
pvec-entity = { path = "../pvec-entity" }

[dev-dependencies]
pvec-codec = { path = "../pvec-codec" }
pvec-geometry = { path = "../pvec-geometry" }

[lints]
workspace = true
