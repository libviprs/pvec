[package]
name = "pvec-harness"
version = "0.0.0"
description = "The conformance harness: evidence classes, gate rules and report rows (EPIC P, phase 2)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Test support, like pvec-corpus: nothing in src opens a socket or starts a process. The STEP round trip test
# (issue 150) starts the evaluator container through pvec-hermetic, so that is a dev-dependency only.
[dependencies]
pvec-capabilities = { path = "../pvec-capabilities" }
pvec-corpus = { path = "../pvec-corpus" }
pvec-entity = { path = "../pvec-entity" }
pvec-geometry = { path = "../pvec-geometry" }
pvec-interchange = { path = "../pvec-interchange" }
pvec-numeric = { path = "../pvec-numeric" }

[dev-dependencies]
pvec-hermetic = { path = "../pvec-hermetic" }
pvec-checks = { path = "../pvec-checks" }

[lints]
workspace = true
