# The feature table below capability level. FEATURES.md is generated from this file; I do not edit that by hand.
# Regenerate with: PVEC_BLESS_FEATURES=1 cargo test -p pvec-checks --test issue_299_features
# producer = libviprs writes it, driver = pvec-scene accepts it (the SUPPORTED list, which the libviprs gate holds the writer to, issue 302), consumer = planviewer draws it.

[[feature]]
key = "23.stroke_item"
what = "A run of strokes in the paint order."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-23-paint-order.pvec"

[[feature]]
key = "23.fill_item"
what = "A run of hatch fills in the paint order, so a stroke can sit under a fill."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-23-paint-order.pvec"
regions = ["fid-blueprint-mix/bp-building-fill", "fid-blueprint-mix/bp-building-b", "fid-blueprint-mix/bp-parcel-tan", "fid-alpha/alpha-grey-plain", "fid-clips/half-circle-below"]

[[feature]]
key = "23.raster_item"
what = "A raster named in the paint order, so a picture is painted where the PDF paints it."
producer = true
driver = true
consumer = false
golden = "tests/compat/blueprint-mix-23-paint-order.pvec"
regions = ["fid-raster-mix/raster-quadrant-red", "fid-raster-mix/raster-quadrant-green", "fid-raster-mix/raster-quadrant-blue", "fid-raster-mix/raster-ramp", "fid-raster-mix/raster-over-fill", "fid-raster-mix/white-over-raster", "fid-raster-smask/smask-ramp-left", "fid-raster-smask/smask-ramp-right", "fid-raster-smask/smask-ramp-all", "fid-raster-smask/smask-opaque", "fid-blueprint-mix/bp-scan-paper", "fid-blueprint-mix/bp-overlay"]

[[feature]]
key = "23.text_item"
what = "A text record named in the paint order."
producer = true
driver = true
consumer = false
golden = "tests/compat/blueprint-mix-23-paint-order.pvec"
regions = ["fid-blueprint-mix/bp-text"]

[[feature]]
key = "24.colour"
what = "A stroke colour per entity."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-24-stroke-paint.pvec"
regions = ["fid-fills/stroke-frame"]

[[feature]]
key = "24.alpha"
what = "Stroke alpha in the low byte of the colour word."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-24-stroke-paint.pvec"
regions = ["fid-alpha/alpha-red-only", "fid-alpha/alpha-overlap", "fid-alpha/alpha-blue-only", "fid-alpha/alpha-over-grey", "fid-alpha/alpha-stroke-over-fill"]

[[feature]]
key = "25.rule.nonzero"
what = "Nonzero winding over all the rings of a hatch record."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-25-fill-paint.pvec"
regions = ["fid-fills/donut-nonzero-inner"]

[[feature]]
key = "25.rule.evenodd"
what = "Even-odd over all the rings of a hatch record."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-25-fill-paint.pvec"
regions = ["fid-fills/star-evenodd-centre"]

[[feature]]
key = "25.gradient.axial"
what = "Axial gradient as sampled stops."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-25-fill-paint.pvec"
regions = ["fid-shading-axial/axial-2stop-ramp", "fid-shading-axial/axial-3stop-ramp", "fid-shading-axial/axial-angled-star", "fid-shading-bounded/hexagon-shade", "fid-shading-bounded/band-shade", "fid-blueprint-mix/bp-legend-ramp"]

[[feature]]
key = "25.gradient.radial"
what = "Radial gradient, the PDF type 3 circle family."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-25-radial-tiling.pvec"
regions = ["fid-shading-radial/radial-concentric", "fid-shading-radial/radial-cone", "fid-shading-radial/radial-inner-extend", "fid-shading-radial/radial-corner-extend"]

[[feature]]
key = "25.gradient.extend"
what = "Paint before the first stop or after the last."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-25-fill-paint.pvec"
regions = ["fid-shading-axial/axial-extend-left", "fid-shading-axial/axial-extend-right"]

[[feature]]
key = "25.tiling.coloured"
what = "Tiling pattern with its own colours."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-25-radial-tiling.pvec"
regions = ["fid-tiling/tiling-checker", "fid-tiling/tiling-hatch", "fid-tiling/tiling-triangle"]

[[feature]]
key = "25.tiling.uncoloured"
what = "Tiling pattern painted in the colour of the hatch record."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-25-fill-paint.pvec"

[[feature]]
key = "26.clip"
what = "A clip region of entity rings with a rule, applied to named items."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-26-clip.pvec"
regions = ["fid-clips/circle-clip-outside", "fid-clips/evenodd-clip-hole", "fid-clips/clip-outside-triangle", "fid-clips/half-circle-above", "fid-clips/half-circle-below"]

[[feature]]
key = "26.nested"
what = "A clip intersected with its parent."
producer = true
driver = true
consumer = true
golden = "tests/compat/blueprint-mix-26-clip.pvec"

[[feature]]
key = "none.blend_mode"
what = "Blend modes other than normal."
reason = "alpha is straight and there is no blend operator in the format."

[[feature]]
key = "none.shading.mesh"
what = "Mesh shadings (PDF types 4 to 7)."
reason = "a mesh is not a gradient and the format holds no PDF function."

[[feature]]
key = "none.soft_mask"
what = "A soft mask as a paint property. A raster carries its mask as alpha instead."
reason = "a mask would need an offscreen pass the format does not describe."
