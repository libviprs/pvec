<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVec viewer</title>
<!--
  The PVec viewer (ADR 0020). A static page over the loadable pvec-wasm module: no framework, no map library,
  no build step. Query parameters: file=<url of a .pvec>, module=<url of pvec_wasm_bg.wasm> (default: next to
  this page). A local file can be opened with the picker instead.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #57606a;
    --line: #d0d7de;
    --accent: #0969da;
    --error: #b42318;
    --canvas: #ffffff;
    --stroke: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --line: #3d444d;
      --accent: #4493f8;
      --error: #ff7b72;
      --canvas: #0d1117;
      --stroke: #e6edf3;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #9198a1;
    --line: #3d444d;
    --accent: #4493f8;
    --error: #ff7b72;
    --canvas: #0d1117;
    --stroke: #e6edf3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  button, label.file {
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:focus-visible, label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #status { color: var(--muted); flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
  #status.error { color: var(--error); }
  #readout { padding: 4px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
  /* each on its own line, the pointer's reserved, so moving the pointer never moves the canvas */
  #readout span { display: block; min-width: 0; overflow-wrap: anywhere; }
  #calibration { min-height: 1.4em; }
  #pointer { min-height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  #scalebar { position: absolute; left: 16px; bottom: 16px; padding: 4px 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; pointer-events: none; font-size: 12px; z-index: 1; }
  #scalebar[hidden] { display: none; }
  #scalebar .bar { display: block; height: 4px; margin-bottom: 4px; background: var(--stroke); }
  main { position: relative; flex: 1 1 auto; min-height: 0; }
  .hint { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); margin: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--canvas); }
</style>
</head>
<body>
<header>
  <h1>PVec viewer</h1>
  <label class="file">Open file<input id="pick" type="file" accept=".pvec"></label>
  <button id="fit" type="button">Fit</button>
  <span id="status" role="status" aria-live="polite">No file open.</span>
</header>
<div id="readout"><span id="calibration" aria-live="polite"></span><span id="pointer"></span></div>
<main><div id="scalebar" hidden><span class="bar"></span><span class="label"></span></div><canvas id="view" role="img" aria-label="Drawing" aria-describedby="keys"></canvas></main>
<p id="keys" class="hint">Drag to pan, the wheel or double click to zoom. With the drawing focused: arrow keys pan, + and - zoom, 0 fits.</p>
<script type="module" src="./viewer.js"></script>
</body>
</html>
