[package]
name = "p74-ffi-ab"
description = "Candidates (a) and (b): extern C over opaque handles. (a) has a hand-written header, (b) a cbindgen one"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
version.workspace = true

[lib]
name = "pvec_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pvec = { path = "../../../crates/pvec" }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
